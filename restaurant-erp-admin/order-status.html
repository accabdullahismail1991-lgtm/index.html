<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حالة الطلب</title>
<style>
  :root{
    --ink:#1a2030; --muted:#68748a; --border:#e3e6ee; --bg:#f2f3f8; --card:#ffffff;
    --brand:#3730a3; --ok:#1f9d68; --warn:#b45309; --danger:#d0453f;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);
    min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:20px 14px;}
  .hidden{display:none !important;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 30px rgba(20,20,40,.08);
    width:100%;max-width:440px;padding:24px 22px;}
  .brand{text-align:center;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.04em;margin-bottom:6px;}
  h1{font-size:15px;margin:0 0 2px;text-align:center;color:var(--muted);font-weight:600;}
  .order-no{font-size:30px;font-weight:800;text-align:center;margin:2px 0 4px;}
  .meta{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:18px;}
  .meta span{margin:0 4px;}

  .status-banner{border-radius:12px;padding:14px 16px;text-align:center;font-weight:800;font-size:15px;margin-bottom:18px;}
  .status-banner.stage-RECEIVED,.status-banner.stage-PAID{background:rgba(104,116,138,.1);color:var(--muted);}
  .status-banner.stage-PREPARING{background:rgba(180,83,9,.1);color:var(--warn);}
  .status-banner.stage-READY{background:rgba(31,157,104,.12);color:var(--ok);}
  .status-banner.stage-SERVED{background:rgba(55,48,163,.1);color:var(--brand);}
  .status-banner.stage-VOIDED{background:rgba(208,69,63,.1);color:var(--danger);}

  .stepper{display:flex;align-items:flex-start;justify-content:space-between;margin:0 0 22px;padding:0 4px;}
  .step{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;}
  .step .dot{width:30px;height:30px;border-radius:50%;background:var(--bg);border:2px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);z-index:1;}
  .step .lb{font-size:10.5px;color:var(--muted);margin-top:6px;font-weight:600;line-height:1.3;max-width:70px;}
  .step::after{content:'';position:absolute;top:14px;right:50%;width:100%;height:2px;background:var(--border);z-index:0;}
  .step:first-child::after{display:none;}
  .step.done .dot{background:var(--brand);border-color:var(--brand);color:#fff;}
  .step.done::after{background:var(--brand);}
  .step.current .dot{background:#fff;border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 4px rgba(55,48,163,.12);}

  .lines{border-top:1px solid var(--border);margin-top:6px;padding-top:12px;}
  .line{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);}
  .line:last-child{border-bottom:none;}
  .line .name{font-size:13.5px;font-weight:700;}
  .line .note{font-size:11.5px;color:var(--danger);margin-top:2px;}
  .line .qty{color:var(--muted);font-size:12px;font-weight:600;margin-inline-start:6px;}
  .badge{font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:700;white-space:nowrap;}
  .badge.QUEUED{background:rgba(104,116,138,.15);color:var(--muted);}
  .badge.PREPARING{background:rgba(180,83,9,.15);color:var(--warn);}
  .badge.READY{background:rgba(31,157,104,.15);color:var(--ok);}
  .badge.SERVED{background:rgba(55,48,163,.12);color:var(--brand);}

  .total-row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;
    border-top:2px solid var(--border);font-size:15px;font-weight:800;}

  .refresh-hint{text-align:center;color:var(--muted);font-size:11px;margin-top:16px;}
  .state-msg{text-align:center;color:var(--muted);font-size:13.5px;padding:30px 10px;}
  .state-msg.err{color:var(--danger);}
</style>
</head>
<body>

<div class="card">
  <div class="brand">🍽️ Restaurant ERP</div>
  <div id="loadingState" class="state-msg">جارٍ تحميل حالة الطلب...</div>
  <div id="errorState" class="state-msg err hidden"></div>

  <div id="content" class="hidden">
    <h1 id="locationName"></h1>
    <div class="order-no">#<span id="orderNo"></span></div>
    <div class="meta" id="metaLine"></div>

    <div id="statusBanner" class="status-banner"></div>
    <div id="stepper" class="stepper"></div>

    <div id="lines" class="lines"></div>
    <div class="total-row"><span>الإجمالي</span><span id="grandTotal"></span></div>
    <div class="refresh-hint">🔄 هذه الصفحة تتحدّث تلقائيًا كل بضع ثوانٍ</div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const orderId = params.get('order');
const apiBase = (params.get('api') || 'https://restaurant-erp-api-rbb9.onrender.com').replace(/\/$/, '');

const STAGES = [
  { key: 'RECEIVED', icon: '🧾', label: 'تم الاستلام' },
  { key: 'PREPARING', icon: '🍳', label: 'قيد التحضير' },
  { key: 'READY', icon: '✅', label: 'جاهز' },
  { key: 'SERVED', icon: '🎉', label: 'تم التقديم' },
];
const STAGE_BANNER_TEXT = {
  RECEIVED: '🧾 تم استلام طلبك -- بانتظار المطبخ',
  PAID: '💳 تم الدفع -- بانتظار المطبخ',
  PREPARING: '🍳 يتم تحضير طلبك الآن',
  READY: '✅ طلبك جاهز!',
  SERVED: '🎉 تم تقديم طلبك -- بالهناء والشفاء',
  VOIDED: '❌ تم إلغاء هذا الطلب',
};
const CHANNEL_LABEL = {
  DINE_IN: 'صالة', TAKEAWAY: 'تيك أواي', DRIVE_THRU: 'Drive-thru', DELIVERY_PARTNER: 'توصيل خارجي', BRAND_APP: 'تطبيق العلامة',
};

function renderStepper(stage) {
  // VOIDED has no meaningful position on the RECEIVED->SERVED track -- the
  // status banner alone already says everything needed, so the stepper is
  // just hidden for it rather than forcing it into a misleading step.
  if (stage === 'VOIDED') { document.getElementById('stepper').innerHTML = ''; return; }
  const effectiveStage = stage === 'PAID' ? 'RECEIVED' : stage;
  const currentIdx = STAGES.findIndex((s) => s.key === effectiveStage);
  document.getElementById('stepper').innerHTML = STAGES.map((s, i) => {
    const cls = i < currentIdx ? 'done' : i === currentIdx ? 'current' : '';
    return `<div class="step ${cls}"><div class="dot">${i <= currentIdx ? s.icon : i + 1}</div><div class="lb">${s.label}</div></div>`;
  }).join('');
}

function render(data) {
  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('errorState').classList.add('hidden');
  document.getElementById('content').classList.remove('hidden');

  document.getElementById('locationName').textContent = data.locationName;
  document.getElementById('orderNo').textContent = data.orderNumber;
  const metaParts = [CHANNEL_LABEL[data.channel] || data.channel];
  if (data.tableLabel) metaParts.push(data.tableLabel);
  document.getElementById('metaLine').innerHTML = metaParts.map((p) => `<span>${p}</span>`).join('•');

  const banner = document.getElementById('statusBanner');
  banner.className = 'status-banner stage-' + data.stage;
  banner.textContent = STAGE_BANNER_TEXT[data.stage] || data.stage;

  renderStepper(data.stage);

  document.getElementById('lines').innerHTML = data.lines.map((l) => `
    <div class="line">
      <div>
        <div class="name">${l.name} <span class="qty">× ${l.quantity}</span></div>
        ${l.note ? `<div class="note">${l.note}</div>` : ''}
      </div>
      <span class="badge ${l.kitchenStatus}">${
        l.kitchenStatus === 'QUEUED' ? 'بالانتظار' : l.kitchenStatus === 'PREPARING' ? 'يُحضَّر' : l.kitchenStatus === 'READY' ? 'جاهز' : 'قُدِّم'
      }</span>
    </div>
  `).join('');

  document.getElementById('grandTotal').textContent = Number(data.grandTotal).toFixed(2) + ' ريال';
}

function showError(message) {
  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('content').classList.add('hidden');
  const el = document.getElementById('errorState');
  el.textContent = message;
  el.classList.remove('hidden');
}

let pollTimer = null;
async function poll() {
  if (!orderId) { showError('⚠️ رابط غير صالح -- لا يوجد رقم طلب.'); return; }
  try {
    const res = await fetch(apiBase + '/public/orders/' + encodeURIComponent(orderId) + '/status');
    if (!res.ok) {
      if (res.status === 404) { showError('⚠️ لم يتم العثور على هذا الطلب.'); clearInterval(pollTimer); return; }
      throw new Error('HTTP ' + res.status);
    }
    const data = await res.json();
    render(data);
    // A served or voided order's state is final -- no more polling needed.
    if (data.stage === 'SERVED' || data.stage === 'VOIDED') clearInterval(pollTimer);
  } catch (e) {
    // A transient network hiccup shouldn't blank out an already-rendered
    // status -- only show the error state if we never managed to render
    // anything at all yet.
    if (document.getElementById('content').classList.contains('hidden')) {
      showError('⚠️ تعذّر الاتصال بالخادم. سيُعاد المحاولة تلقائيًا...');
    }
  }
}
poll();
pollTimer = setInterval(poll, 5000);
</script>

</body>
</html>
